name: Test Solution

on:
  push:
    branches: [ 'task-*' ]
  pull_request:
    branches: [ 'task-*' ]

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle more aggressively
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/configuration-cache
            ~/.gradle/build-cache
            ~/.gradle/daemon
            ~/.gradle/native
            .gradle
            **/build
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/src/**/*.java') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Extract task name
        id: task
        run: |
          BRANCH=${{ github.ref_name }}
          TASK=$(echo "$BRANCH" | sed 's/-.*$//')
          echo "task_name=$TASK" >> $GITHUB_OUTPUT

      - name: Run tests with optimized Gradle
        run: |
          ./gradlew :module-01-core:${{ steps.task.outputs.task_name }}:test \
            --no-daemon \
            --parallel \
            --build-cache \
            --configuration-cache

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.ref_name }}
          path: '**/build/test-results/test/*.xml'
